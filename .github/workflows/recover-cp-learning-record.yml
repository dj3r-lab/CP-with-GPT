name: Recover CP Learning Record
on:
  push:
    paths:
      - '.github/workflows/recover-cp-learning-record.yml'
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover workbook from repair commit
        run: git show ea1430b370593c4caf4738d7d4f9ead3a6d287d4:records/CP_Learning_Record.xlsx > CP_Learning_Record.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: cp-learning-record-recovery
          path: CP_Learning_Record.xlsx
          retention-days: 1
