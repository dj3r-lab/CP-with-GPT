name: Recover CP Learning Record
on:
  push:
    paths:
      - '.github/workflows/recover-cp-learning-record.yml'
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover workbook from last good commit
        run: git show a9078809265edf807eedf60336c834b06a7fe17a:records/CP_Learning_Record.xlsx > CP_Learning_Record.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: cp-learning-record-recovery
          path: CP_Learning_Record.xlsx
          retention-days: 1
