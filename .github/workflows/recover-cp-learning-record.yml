name: Recover CP Learning Record
on:
  push:
    paths:
      - '.github/workflows/recover-cp-learning-record.yml'
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble staged workbook chunks
        shell: bash
        run: |
          cat .tmp/cp_chunks/00 .tmp/cp_chunks/01 .tmp/cp_chunks/02 .tmp/cp_chunks/03 .tmp/cp_chunks/04 .tmp/cp_chunks/05 > CP_Learning_Record_reconstructed.b64
          base64 --decode CP_Learning_Record_reconstructed.b64 > CP_Learning_Record.xlsx
          python - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          p='CP_Learning_Record.xlsx'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for n in z.namelist():
                  if n.endswith('.xml'):
                      ET.fromstring(z.read(n))
          print('ZIP/XML validation passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cp-learning-record-chunk-reconstruction
          path: CP_Learning_Record.xlsx
          retention-days: 1
